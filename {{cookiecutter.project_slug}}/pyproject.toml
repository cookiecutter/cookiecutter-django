[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.description }}"
readme = "README.md"
license = { text = "{{ cookiecutter.open_source_license }}" }
authors = [
  { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.email }}" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  {# set the an initial indentation for uv to follow #}
  "django",
]

[dependency-groups]
dev = [
  {# set the an initial indentation for uv to follow #}
  "pytest",
]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "element,slot"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "ANN401", # Any is the honest annotation for pass-through *args/**kwargs
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.per-file-ignores."**/conftest.py" = [ "ANN" ]
lint.per-file-ignores."**/tests/**" = [ "ANN" ]
lint.isort.force-single-line = true
{%- if cookiecutter.rest_api == 'Django Ninja' %}
# django-ninja evaluates view annotations at import time to build the OpenAPI
# schema, so imports used only in those annotations must stay at runtime.
lint.flake8-type-checking.runtime-evaluated-decorators = [
  "ninja.NinjaAPI.api_operation",
  "ninja.NinjaAPI.delete",
  "ninja.NinjaAPI.get",
  "ninja.NinjaAPI.patch",
  "ninja.NinjaAPI.post",
  "ninja.NinjaAPI.put",
  "ninja.Router.api_operation",
  "ninja.Router.delete",
  "ninja.Router.get",
  "ninja.Router.patch",
  "ninja.Router.post",
  "ninja.Router.put",
]
{%- endif %}

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "{{cookiecutter.project_slug}}/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
# Strict mode: every function is annotated and every call is checked.
strict = true
warn_unreachable = true
# django-allauth ships no type information, so its adapters and forms are
# subclassed from ``Any``. Keep that permitted.
disallow_subclassing_any = false
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]
plugins = [
  "mypy_django_plugin.main",
  {%- if cookiecutter.rest_api == 'DRF' %}
  "mypy_drf_plugin.main",
  {%- endif %}
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Test bodies are still checked, but signatures may stay unannotated:
module = [ "*.tests.*", "tests.*", "*.conftest", "conftest" ]
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# factory-boy re-exports its API from the package root without ``__all__``:
module = "factory.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# Third-party packages that ship neither stubs nor a ``py.typed`` marker.
# Add a dependency here only after checking that no stubs package exists for it.
module = [
  "allauth.*",
  {%- if cookiecutter.use_celery == 'y' %}
  "django_celery_beat.*",
  {%- endif %}
  "environ.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
