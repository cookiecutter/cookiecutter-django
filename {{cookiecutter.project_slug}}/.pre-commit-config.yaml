exclude: '^docs/|/migrations/|devcontainer.json|/static/vendor/'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.32.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.29.3
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/djlint/djLint
    rev: v1.46.1
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django

  # mypy needs the project's dependencies and Django settings, so it runs from
  # the project environment on push rather than from an isolated hook environment.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        {%- if cookiecutter.use_docker == 'y' %}
        entry: docker compose -f docker-compose.local.yml run --rm django mypy .
        {%- else %}
        entry: uv run mypy .
        {%- endif %}
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: [mypy] # needs the project environment
  submodules: false
