{% load allauth %}

<section>
  <c-card class="mb-4">
    <c-card.header>
      <c-card.title>
        {% slot title %}
      {% endslot %}
      </c-card.title>
    </c-card.header>
    <c-card.content>
      {% slot body %}
      {% endslot %}
      {% if slots.actions %}
        <ul class="mt-4 space-y-2">
          {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
        </ul>
      {% endif %}
    </c-card.content>
  </c-card>
</section>
