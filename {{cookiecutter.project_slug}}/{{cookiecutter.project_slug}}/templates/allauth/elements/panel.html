{% raw %}{% load allauth %}

<article>
  <header>
    <h2>
      {% slot title %}
      {% endslot %}
    </h2>
  </header>
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <footer>
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </footer>
  {% endif %}
</article>
{%- endraw %}
